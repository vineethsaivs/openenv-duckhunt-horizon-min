[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "duckhunt-env"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openenv-core[core]>=0.2.1",
    "fastapi",
    "uvicorn",
    "pillow",
    "pydantic>=2",
]

[project.optional-dependencies]
server = ["uvicorn[standard]", "pillow", "fastapi"]
client = ["httpx"]
